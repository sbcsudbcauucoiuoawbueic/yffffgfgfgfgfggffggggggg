/* iPhone search: full-width input, explicit focus, and a single clear control. */
.iphone-search-field input::placeholder{color:#A8A8AD;opacity:1}
.iphone-search-field input::-webkit-search-cancel-button,
.iphone-search-field input::-webkit-search-decoration{-webkit-appearance:none}
.iphone-search-field:focus-within{box-shadow:inset 0 0 0 1px #AA9EF0}
.iphone-search-sheet button,.home-search-trigger{touch-action:manipulation}
.iphone-search-sheet button:focus-visible,.home-search-trigger:focus-visible{outline:2px solid #AA9EF0;outline-offset:2px}

/* Full-screen account picker, matching the mobile account-switching reference. */
.account-switcher{position:fixed;inset:0;z-index:110;background:#000;color:#fff;font-family:Inter,-apple-system,'Segoe UI',sans-serif;overflow:hidden}
.account-switcher-panel{height:100%;height:100dvh;max-width:393px;margin:0 auto;padding-top:env(safe-area-inset-top);display:flex;flex-direction:column;background:#000;animation:account-open 280ms cubic-bezier(.22,.9,.28,1)}
.account-grabber{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;flex-shrink:0;touch-action:none}
.account-grabber span{width:32px;height:4px;border-radius:8px;background:#636366}
.account-switcher-header{display:flex;align-items:center;gap:8px;padding:0 20px 12px;flex-shrink:0}
.account-switcher-header h1{font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-icon-button{display:flex;align-items:center;justify-content:center;width:44px;min-width:44px;height:44px;border-radius:50%;color:#c9c9ce;touch-action:manipulation}
.account-add{background:#141416}
.account-switcher-content{padding:0 20px max(24px,env(safe-area-inset-bottom));flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;animation:fadeIn 140ms ease-out}
.account-switcher-row{display:flex;align-items:center;margin-bottom:10px;padding:0 6px 0 14px;background:#161618;border-radius:16px;min-height:64px}
.account-select{display:flex;align-items:center;gap:14px;flex:1;min-width:0;min-height:64px;text-align:left;touch-action:manipulation}
.account-number{display:flex;align-items:center;justify-content:center;position:relative;width:30px;height:34px;flex-shrink:0;color:#a8a8ad;font-size:12px}
.account-selected{position:absolute;bottom:0;right:-2px;width:19px;height:19px;border-radius:50%;background:#aa9ef0;display:flex;align-items:center;justify-content:center}
.account-row-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.account-action{display:flex;align-items:center;gap:16px;width:100%;min-height:66px;margin-bottom:10px;padding:12px 18px;text-align:left;border-radius:16px;background:#161618;font-size:16px;touch-action:manipulation}
.account-action strong{display:block;font-weight:600}.account-action small{display:block;color:#a8a8ad;font-size:13px;margin-top:3px}
.account-name-label{display:block;margin:8px 0;color:#a8a8ad;font-size:15px}
#account-name{width:100%;height:52px;background:#161618;border:1px solid #333336;border-radius:14px;padding:0 14px;font-size:17px;color:#fff;caret-color:#aa9ef0;user-select:text}
.account-save{width:100%;min-height:50px;margin-top:18px;background:#aa9ef0;border-radius:25px;color:#0b0b0d;font-size:17px;font-weight:600}
.account-error{font-size:14px;color:#ff9999;padding-top:12px}
.account-switcher button:focus-visible,.account-switcher input:focus-visible{outline:2px solid #aa9ef0;outline-offset:2px}
@keyframes account-open{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.account-switcher-panel,.account-switcher-content{animation:none}}
